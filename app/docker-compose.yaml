services:
  postgres:
    image: postgres:15-alpine
    container_name: shortsmaker-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shortsmaker
    volumes:
      - ./manifests/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shortsmaker-network

  minio:
    image: minio/minio
    container_name: shortsmaker-minio
    ports:
      - "39000:9000"
      - "39001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - shortsmaker-network

  wiremock:
    image: wiremock/wiremock:latest
    container_name: shortsmaker-wiremock
    ports:
      - "38081:8080"
    volumes:
      - ./manifests/wiremock/mappings:/home/wiremock/mappings
    networks:
      - shortsmaker-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: shortsmaker-pgadmin
    ports:
      - "35050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shortsmaker.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./manifests/pgadmin/provisioning/servers.json:/pgadmin4/servers.json
    networks:
      - shortsmaker-network
    depends_on:
      - postgres

volumes:
  minio_data:
  pgadmin_data:

networks:
  shortsmaker-network:
    driver: bridge
